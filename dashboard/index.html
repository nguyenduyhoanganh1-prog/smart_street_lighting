<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#0f1a2b" />
    <title>Đèn Công Cộng Nhóm 15</title>
    <script>
      (function(){var r=document.documentElement,t=null;try{t=localStorage.getItem("dencongcong-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=r.getAttribute("data-theme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)r.classList.add("dark")})()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
